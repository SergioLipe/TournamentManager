<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline · Tournament</title>
    <meta name="theme-color" content="#2f6fed">

    <!--
        Página mostrada pelo service worker quando não há rede.

        O estilo vai aqui dentro de propósito: se a folha de estilos não
        estiver em cache, uma página de erro sem estilo nenhum é a última
        coisa que se quer mostrar.
    -->
    <style>
        :root {
            --fundo: #f1f3f5;
            --caixa: #ffffff;
            --texto: #1f2933;
            --suave: #5c6b7a;
            --acento: #2f6fed;
            --borda: #d3d9df;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --fundo: #14181d;
                --caixa: #1c222a;
                --texto: #e6ebf0;
                --suave: #9aa7b4;
                --acento: #5b8ff9;
                --borda: #313b46;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--fundo);
            color: var(--texto);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }

        .caixa {
            max-width: 420px;
            padding: 32px 28px;
            background: var(--caixa);
            border: 1px solid var(--borda);
            border-radius: 10px;
        }

        img { width: 72px; height: 72px; border-radius: 16px; }

        h1 { margin: 20px 0 8px; font-size: 1.35rem; }

        p { margin: 0 0 24px; color: var(--suave); line-height: 1.5; }

        button {
            padding: 10px 22px;
            font: inherit;
            color: #fff;
            background: var(--acento);
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        button:active { opacity: .85; }
    </style>
</head>

<body>
    <div class="caixa">
        <img src="icons/icon-192.png" alt="">
        <h1>No connection</h1>
        <p>
            The themes and the competitors live on the server, so Tournament
            needs a connection to start a bracket. Try again once you are back
            online.
        </p>
        <button type="button" onclick="location.replace('app.php')">Try again</button>
    </div>
</body>

</html>
